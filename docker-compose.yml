services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://ops:ops@db:5432/ops
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run seed && npm start"
  worker:
    build: .
    environment:
      DATABASE_URL: postgres://ops:ops@db:5432/ops
    depends_on:
      db:
        condition: service_healthy
    command: npm run worker
volumes:
  postgres_data:
